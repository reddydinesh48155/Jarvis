[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nova-backend"
version = "0.1.0"
description = "NOVA autonomous AI voice assistant backend - Part 2 LiveKit realtime transport"
requires-python = ">=3.11,<3.12"
dependencies = [
    "alembic>=1.13,<2.0",
    "asyncpg>=0.29,<1.0",
    "bcrypt>=4.0,<4.1",
    "fastapi>=0.115,<1.0",
    "livekit-agents==1.7.1",
    "livekit-api==1.2.1",
    "passlib[bcrypt]>=1.7.4,<2.0",
    "pydantic[email]>=2.7,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "python-jose[cryptography]>=3.3,<4.0",
    "sqlalchemy[asyncio]>=2.0.30,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "aiosqlite>=0.20,<1.0",
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
